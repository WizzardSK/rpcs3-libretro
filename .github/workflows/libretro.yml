name: Build libretro core

defaults:
  run:
    shell: bash

# Test builds only, started by hand. The core is nowhere near ready to be
# published on every push, and a full RPCS3 build is not something to spend a
# runner on unless someone asked for it.
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish the cores as a prerelease'
        type: boolean
        default: true

concurrency:
  group: ${{ github.ref }}-libretro
  cancel-in-progress: true

env:
  BUILD_ARTIFACTSTAGINGDIRECTORY: ${{ github.workspace }}/artifacts/

jobs:
  Build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            docker_img: "rpcs3/rpcs3-ci-jammy:1.7"
          - os: ubuntu-24.04-arm
            arch: aarch64
            docker_img: "rpcs3/rpcs3-ci-jammy-aarch64:1.7"
    name: libretro core ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/ccache
      ARTDIR: "/root/artifacts"
      COMPILER: clang
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Restore build Ccache
        uses: actions/cache/restore@main
        id: restore-build-ccache
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-libretro-ccache-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-libretro-ccache-${{ runner.arch }}-

      - name: Docker setup and build
        run: |
          mkdir -p "${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}" "${{ env.CCACHE_DIR }}"
          docker pull --quiet ${{ matrix.docker_img }}
          docker run \
            -v $PWD:/rpcs3 \
            --env-file .ci/docker.env \
            -v ${{ env.CCACHE_DIR }}:/root/.ccache \
            -v ${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}:${{ env.ARTDIR }} \
            ${{ matrix.docker_img }} \
            /rpcs3/.ci/build-libretro.sh

      - name: Name the core after the architecture it is for
        run: |
          cd "${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}"
          mv rpcs3_libretro.so rpcs3_libretro_linux_${{ matrix.arch }}.so

      - name: Upload artifacts
        uses: actions/upload-artifact@main
        with:
          name: rpcs3_libretro-linux-${{ matrix.arch }}
          path: ${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}/*.so
          compression-level: 0

      - name: Save build Ccache
        if: always()
        uses: actions/cache/save@main
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.restore-build-ccache.outputs.cache-primary-key }}

  Windows:
    # Experimental, and allowed to fail: nothing has ever built this core on
    # Windows. The port is written with MSVC in mind - rpcs3/libretro has both
    # a WIN32 branch for the .dll suffix and an if(NOT MSVC) one for the GCC
    # flags - but it is not in rpcs3.sln, which is how upstream builds Windows,
    # so CMake with the MSVC generator is the only way in. LLVM comes from the
    # runner image rather than the submodule, which would dwarf the core.
    name: libretro core windows-x64 (experimental)
    runs-on: windows-2025
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Fetch the submodules the build uses
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          git submodule -q update --init --depth 1 \
            $(awk '/path/ && !/llvm/ && !/opencv/ { print $3 }' .gitmodules)

      - name: Locate LLVM
        shell: bash
        run: |
          # A Windows path, not the MSYS one bash prints: CMake takes "C:/..."
          # and does not know what to do with "/c/...".
          for d in "/c/Program Files/LLVM" "$LLVM_PATH"; do
            if [ -d "$d/lib/cmake/llvm" ]; then
              echo "LLVM_DIR=$(cygpath -m "$d")/lib/cmake/llvm" >> "$GITHUB_ENV"
              break
            fi
          done
          echo "what is installed:"
          "/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -property displayName || true
          cat "$GITHUB_ENV"

      # Naming a Visual Studio generator means naming its version, and the
      # image moves on; the first attempt asked for 2022 on a runner that no
      # longer has it. Putting MSVC in the environment and building with Ninja
      # sidesteps the question.
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DBUILD_LIBRETRO_CORE_ONLY=ON \
            -DBUILD_LLVM=OFF \
            -DSTATIC_LINK_LLVM=ON \
            -DLLVM_DIR="$LLVM_DIR" \
            -DUSE_NATIVE_INSTRUCTIONS=OFF \
            -DUSE_PRECOMPILED_HEADERS=OFF \
            -DUSE_SYSTEM_FFMPEG=OFF \
            -DUSE_DISCORD_RPC=OFF \
            -DUSE_LTO=OFF

      - name: Build
        shell: bash
        run: cmake --build build --config Release --target rpcs3_libretro

      - name: Collect
        shell: bash
        run: |
          mkdir -p artifacts
          find build -name 'rpcs3_libretro.dll' -exec cp {} artifacts/rpcs3_libretro_windows_x86_64.dll \;
          ls -la artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@main
        with:
          name: rpcs3_libretro-windows-x86_64
          path: artifacts/*.dll
          compression-level: 0

  Android:
    # Experimental, and allowed to fail, like Windows. Android is reachable in
    # principle - 3rdparty/llvm/CMakeLists.txt has an if(ANDROID) branch that
    # builds LLVM for AArch64 with an Android triple - but cross-building LLVM
    # is far larger than the core it serves and does not belong in a test run.
    # So this takes the other door RPCS3 leaves open, WITH_LLVM=OFF, which
    # drops the PPU and SPU recompilers and leaves the interpreters.
    #
    # That makes this a build test, not something anyone should expect to play
    # on: interpreted PS3 emulation on a phone is not going to be playable.
    # What it answers is whether the core compiles for Android at all.
    name: libretro core android-arm64 (experimental)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Fetch the submodules the build uses
        run: |
          git config --global --add safe.directory '*'
          git submodule -q update --init --depth 1 \
            $(awk '/path/ && !/llvm/ && !/opencv/ { print $3 }' .gitmodules)

      - name: Configure
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "using NDK at $NDK"
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_LIBRETRO_CORE_ONLY=ON \
            -DWITH_LLVM=OFF \
            -DUSE_NATIVE_INSTRUCTIONS=OFF \
            -DUSE_PRECOMPILED_HEADERS=OFF \
            -DUSE_SDL=OFF \
            -DUSE_SYSTEM_FFMPEG=OFF \
            -DUSE_DISCORD_RPC=OFF \
            -DUSE_LTO=OFF

      - name: Build
        run: cmake --build build --target rpcs3_libretro

      - name: Collect
        run: |
          mkdir -p artifacts
          find build -name 'rpcs3_libretro.so' -exec cp {} artifacts/rpcs3_libretro_android_arm64.so \;
          ls -la artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@main
        with:
          name: rpcs3_libretro-android-arm64
          path: artifacts/*.so
          compression-level: 0

  Release:
    name: Publish prerelease
    # Windows and Android are allowed to fail, and a continue-on-error job
    # still counts as met here, so waiting on them only means their artifacts
    # join the release when those builds do work.
    needs: [Build, Windows, Android]
    if: inputs.release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Download the cores
        uses: actions/download-artifact@main
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          SHORT=$(git rev-parse --short=8 HEAD)
          TAG="libretro-test-$SHORT"
          {
            echo "Test build of the RPCS3 libretro core. Not a release, and not expected to be useful for playing anything yet."
            echo
            echo "Built from the \`libretro\` branch with \`BUILD_LIBRETRO_CORE_ONLY=ON\`, in the same containers upstream RPCS3 uses for its Linux builds. LLVM is linked statically, so each core is a single file with nothing to place beside it - drop one into RetroArch's \`cores\` directory."
            echo
            echo "These are glibc builds and will not load into a musl frontend."
            echo
            echo "Commit: $SHORT"
          } > notes.md
          # A re-run of the same commit replaces the release rather than failing.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" artifacts/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "libretro core test build ($SHORT)" \
            --notes-file notes.md
