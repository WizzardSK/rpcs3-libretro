name: Build libretro core

defaults:
  run:
    shell: bash

# Test builds only, started by hand. The core is nowhere near ready to be
# published on every push, and a full RPCS3 build is not something to spend a
# runner on unless someone asked for it.
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish the cores as a release'
        type: boolean
        default: true

concurrency:
  group: ${{ github.ref }}-libretro
  cancel-in-progress: true

env:
  BUILD_ARTIFACTSTAGINGDIRECTORY: ${{ github.workspace }}/artifacts/

jobs:
  Build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            docker_img: "rpcs3/rpcs3-ci-jammy:1.7"
          - os: ubuntu-24.04-arm
            arch: aarch64
            docker_img: "rpcs3/rpcs3-ci-jammy-aarch64:1.7"
    name: libretro core ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/ccache
      ARTDIR: "/root/artifacts"
      COMPILER: clang
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Restore build Ccache
        uses: actions/cache/restore@main
        id: restore-build-ccache
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-libretro-ccache-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-libretro-ccache-${{ runner.arch }}-

      - name: Docker setup and build
        run: |
          mkdir -p "${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}" "${{ env.CCACHE_DIR }}"
          docker pull --quiet ${{ matrix.docker_img }}
          docker run \
            -v $PWD:/rpcs3 \
            --env-file .ci/docker.env \
            -v ${{ env.CCACHE_DIR }}:/root/.ccache \
            -v ${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}:${{ env.ARTDIR }} \
            ${{ matrix.docker_img }} \
            /rpcs3/.ci/build-libretro.sh

      - name: Name the core after the architecture it is for
        run: |
          cd "${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}"
          mv rpcs3_libretro.so rpcs3_libretro_linux_${{ matrix.arch }}.so

      # A core is loaded by a frontend on a machine nobody here picked, so what
      # it needs by soname decides whether it loads at all. The first build to
      # go out wanted libGLEW.so.2.2 and would not load on a distribution that
      # ships a different one, and nothing in the build said so - it only turned
      # up when someone tried it. List them here, and fail on the ones that are
      # ours to carry rather than the system's to provide.
      - name: Report what the core needs at load time
        run: |
          cd "${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}"
          readelf -d rpcs3_libretro_linux_${{ matrix.arch }}.so | grep NEEDED
          if readelf -d rpcs3_libretro_linux_${{ matrix.arch }}.so | grep -qE 'NEEDED.*(libGLEW|libopencv)'; then
            echo "::error::the core still needs a library the build image provided but a user's system will not"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@main
        with:
          name: rpcs3_libretro-linux-${{ matrix.arch }}
          path: ${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}/*.so
          compression-level: 0

      - name: Save build Ccache
        if: always()
        uses: actions/cache/save@main
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.restore-build-ccache.outputs.cache-primary-key }}

  Windows:
    # Experimental, and allowed to fail. Built under MSYS2's clang64 rather
    # than MSVC: the core exists only as a CMake target, so rpcs3.sln - the way
    # upstream builds Windows - is no use, and CMake with MSVC gets no further
    # because the LLVM on the runner image is the client distribution, with no
    # CMake package and no static libraries for find_package(LLVM) to find.
    # clang64 ships all of that as packages, which is the same environment
    # .ci/build-windows-clang.sh already uses for the application.
    name: libretro core windows-x64 (experimental)
    runs-on: windows-2025
    continue-on-error: true
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Setup msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: clang64
          update: true
          cache: true
          install: |
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-ccache
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-llvm
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-opencv
            mingw-w64-clang-x86_64-glew
            mingw-w64-clang-x86_64-vulkan
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            base-devel
            curl
            git
            p7zip

      - name: Build
        run: .ci/build-windows-clang-libretro.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@main
        with:
          name: rpcs3_libretro-windows-x86_64
          path: artifacts/*.dll
          compression-level: 0

  Android:
    # Experimental, and allowed to fail, like Windows. Android is reachable in
    # principle - 3rdparty/llvm/CMakeLists.txt has an if(ANDROID) branch that
    # builds LLVM for AArch64 with an Android triple - but cross-building LLVM
    # is far larger than the core it serves and does not belong in a test run.
    # LLVM is built from the submodule here, for AArch64 only - the branch for
    # that is already in 3rdparty/llvm/CMakeLists.txt. Skipping it was the plan
    # and did not survive contact: the AArch64 CPU backend uses llvm:: types
    # whether or not WITH_LLVM is set, so there is no arm64 build without it.
    #
    # What this answers is whether the core compiles for Android at all. Even
    # when it does, nobody should expect to play on it.
    name: libretro core android-arm64 (experimental)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      # Everything, LLVM included. It cannot be left out after all: the AArch64
      # CPU backend is compiled for every arm64 target and uses llvm:: types
      # without asking whether WITH_LLVM is on, so an arm64 build without LLVM
      # does not compile. Nothing ships a prebuilt LLVM for Android either, so
      # it gets built here - the long pole in this job by a wide margin.
      - name: Fetch the submodules the build uses
        run: |
          git config --global --add safe.directory '*'
          git submodule -q update --init --depth 1 \
            $(awk '/path/ { print $3 }' .gitmodules)

      # RPCS3 cannot be built without ffmpeg - the option only chooses between
      # the system copy and a prebuilt one - and the prebuilts it downloads are
      # named ffmpeg-windows, ffmpeg-macos and ffmpeg-linux. Android counts as
      # UNIX, so it would fetch a glibc Linux build and fail to link against
      # it. Cross-building one is the only way through.
      - name: Cross-build ffmpeg for Android
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          PREFIX="$PWD/ffmpeg-android"
          git clone --quiet --depth 1 -b release/7.1 https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          cd ffmpeg-src
          ./configure \
            --prefix="$PREFIX" \
            --target-os=android --arch=aarch64 --enable-cross-compile \
            --cc="$TC/aarch64-linux-android30-clang" \
            --cxx="$TC/aarch64-linux-android30-clang++" \
            --ar="$TC/llvm-ar" --ranlib="$TC/llvm-ranlib" \
            --nm="$TC/llvm-nm" --strip="$TC/llvm-strip" \
            --enable-static --disable-shared --enable-pic \
            --disable-programs --disable-doc --disable-avdevice --disable-network
          make -j"$(nproc)"
          make install
          echo "FFMPEG_PREFIX=$PREFIX" >> "$GITHUB_ENV"
          ls "$PREFIX/lib/pkgconfig"

      - name: Configure
        env:
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/ffmpeg-android/lib/pkgconfig
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "using NDK at $NDK"
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_LIBRETRO_CORE_ONLY=ON \
            -DWITH_LLVM=ON \
            -DBUILD_LLVM=ON \
            -DUSE_NATIVE_INSTRUCTIONS=OFF \
            -DUSE_PRECOMPILED_HEADERS=OFF \
            -DUSE_SDL=OFF \
            -DUSE_DISCORD_RPC=OFF \
            -DUSE_LTO=OFF \
            -DUSE_SYSTEM_CURL=OFF \
            -DUSE_SYSTEM_OPENCV=OFF \
            -DUSE_SYSTEM_SDL=OFF \
            -DUSE_SYSTEM_ZLIB=OFF \
            -DUSE_SYSTEM_OPENAL=OFF \
            -DUSE_SYSTEM_FFMPEG=ON \
            -DCMAKE_PREFIX_PATH="$FFMPEG_PREFIX" \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH

      - name: Build
        run: cmake --build build --target rpcs3_libretro

      - name: Collect
        run: |
          mkdir -p artifacts
          find build -name 'rpcs3_libretro.so' -exec cp {} artifacts/rpcs3_libretro_android_arm64.so \;
          ls -la artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@main
        with:
          name: rpcs3_libretro-android-arm64
          path: artifacts/*.so
          compression-level: 0

  Release:
    name: Publish release
    # Windows and Android are allowed to fail, and a continue-on-error job
    # still counts as met here, so waiting on them only means their artifacts
    # join the release when those builds do work.
    needs: [Build, Windows, Android]
    if: inputs.release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Download the cores
        uses: actions/download-artifact@main
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          SHORT=$(git rev-parse --short=8 HEAD)
          TAG="libretro-test-$SHORT"
          {
            echo "Test build of the RPCS3 libretro core. Not a release, and not expected to be useful for playing anything yet."
            echo
            echo "Built from the \`libretro\` branch with \`BUILD_LIBRETRO_CORE_ONLY=ON\`, in the same containers upstream RPCS3 uses for its Linux builds. LLVM is linked statically, so each core is a single file with nothing to place beside it - drop one into RetroArch's \`cores\` directory."
            echo
            echo "These are glibc builds and will not load into a musl frontend."
            echo
            echo "Commit: $SHORT"
          } > notes.md
          # A re-run of the same commit replaces the release rather than failing.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" artifacts/* \
            --target "$GITHUB_SHA" \
            --title "libretro core test build ($SHORT)" \
            --notes-file notes.md
