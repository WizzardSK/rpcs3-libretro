# DESCRIPTION: GitLab CI/CD for libRetro (NOT FOR GitLab-proper)

# Linux x64, Linux aarch64, Windows x64 and Android arm64-v8a.
#
# The buildbot's own Linux images are Ubuntu 16.04 with gcc 9, which cannot
# build RPCS3 at all, so the Linux jobs run in the images upstream RPCS3 builds
# its Linux releases in - the same ones the GitHub workflow uses - through the
# same script.

##############################################################################
################################# BOILERPLATE ################################
##############################################################################

.core-defs:
  variables:
    # The jobs fetch the submodules themselves, LLVM only where it is built.
    GIT_SUBMODULE_STRATEGY: none
    CORENAME: rpcs3
    EXTRA_PATH: rpcs3/libretro

# .gitmodules is upstream's, and upstream gives its submodules URLs relative to
# its own GitHub repository (../../asmjit/asmjit.git). Cloned from
# git.libretro.com those resolve to git.libretro.com/asmjit/asmjit.git, which
# does not exist, so point them back at GitHub before anything is fetched.
.submodule-urls: &submodule-urls
  - git config --global --add safe.directory '*'
  - sed -i 's#url = \.\./\.\./#url = https://github.com/#' .gitmodules
  - git submodule -q sync

.linux-defs:
  variables:
    COMPILER: clang
    RPCS3_DIR: $CI_PROJECT_DIR
    ARTDIR: $CI_PROJECT_DIR/artifacts
  before_script:
    - *submodule-urls
  script:
    - .ci/build-libretro.sh
    - mv artifacts/$LIBNAME $LIBNAME

# Inclusion templates, required for the build to work
include:
  # Linux
  - project: 'libretro-infrastructure/ci-templates'
    file: '/linux-cmake.yml'

  # Windows
  - project: 'libretro-infrastructure/ci-templates'
    file: '/windows-cmake-mingw.yml'

  # Android
  - project: 'libretro-infrastructure/ci-templates'
    file: '/android-cmake.yml'

stages:
  - build-prepare
  - build-shared

##############################################################################
#################################### STAGES ##################################
##############################################################################

# Linux 64-bit
libretro-build-linux-x64:
  extends:
    - .libretro-linux-cmake-x86_64
    - .core-defs
    - .linux-defs
  image: rpcs3/rpcs3-ci-jammy:2.1

# Linux 64-bit (ARM)
libretro-build-linux-aarch64:
  extends:
    - .libretro-linux-cmake-aarch64
    - .core-defs
    - .linux-defs
  image: rpcs3/rpcs3-ci-jammy-aarch64:2.1

# Windows 64-bit
#
# Cross-built on Linux with llvm-mingw (clang, lld, libc++), the same kind of
# toolchain as the MSYS2 clang64 environment the GitHub workflow builds
# Windows in. The buildbot's own Windows images cannot build RPCS3: MXE's gcc
# is not a toolchain RPCS3 supports, and MSVC 2019 16.8 is too old for its C++.
# .ci/build-windows-cross-libretro.sh makes what clang64 would provide as
# packages (LLVM, GLEW, the Vulkan headers and import library).
libretro-build-windows-x64:
  extends:
    - .libretro-windows-cmake-x86_64
    - .core-defs
  image: mstorsjo/llvm-mingw:latest
  before_script:
    - export NUMPROC=$(($(nproc)/5))
    - *submodule-urls
  script:
    - .ci/build-windows-cross-libretro.sh
    - mv build/bin/$LIBNAME $LIBNAME

# Android 64-bit (ARM)
#
# Nothing ships LLVM or ffmpeg for Android, so both are built here. LLVM comes
# from its submodule (3rdparty/llvm/CMakeLists.txt has the Android branch for
# it) and cannot be left out: the AArch64 CPU backend uses llvm:: types whether
# or not WITH_LLVM is set. ffmpeg's prebuilts are for Windows, macOS and glibc
# Linux only, so it is cross-built from source with the NDK, and kept in the
# GitLab cache between pipelines.
android-arm64-v8a:
  extends:
    - .libretro-android-cmake-arm64-v8a
    - .core-defs
  variables:
    API_LEVEL: 30
    FFMPEG_PREFIX: $CI_PROJECT_DIR/ffmpeg-android
    CORE_ARGS: >-
      -DBUILD_LIBRETRO_CORE_ONLY=ON
      -DWITH_LLVM=ON
      -DBUILD_LLVM=ON
      -DUSE_NATIVE_INSTRUCTIONS=OFF
      -DUSE_PRECOMPILED_HEADERS=OFF
      -DUSE_SDL=OFF
      -DUSE_DISCORD_RPC=OFF
      -DUSE_LTO=OFF
      -DUSE_SYSTEM_CURL=OFF
      -DUSE_SYSTEM_OPENCV=OFF
      -DUSE_SYSTEM_SDL=OFF
      -DUSE_SYSTEM_ZLIB=OFF
      -DUSE_SYSTEM_OPENAL=OFF
      -DUSE_SYSTEM_FFMPEG=ON
      -DCMAKE_PREFIX_PATH=$CI_PROJECT_DIR/ffmpeg-android
      -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH
      -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH
  before_script:
    - export NUMPROC=$(($(nproc)/5))
    - |
      if [ "$ANDROID_NDK_VERSION" = "27.3.13750724" ]; then
        export ANDROID_NDK_VERSION="29.0.14206865"
        export NDK_ROOT="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
      fi
    - *submodule-urls
    - git submodule -q update --init --depth 1 $(awk '/path/ { print $3 }' .gitmodules)
    - |
      TC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
      if [ -f "$FFMPEG_PREFIX/lib/libavcodec.a" ]; then
        echo "ffmpeg from the cache"
      else
      git clone --quiet --depth 1 -b release/7.1 https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
      (cd ffmpeg-src && ./configure \
        --prefix="$FFMPEG_PREFIX" \
        --target-os=android --arch=aarch64 --enable-cross-compile \
        --cc="$TC/aarch64-linux-android${API_LEVEL}-clang" \
        --cxx="$TC/aarch64-linux-android${API_LEVEL}-clang++" \
        --ar="$TC/llvm-ar" --ranlib="$TC/llvm-ranlib" \
        --nm="$TC/llvm-nm" --strip="$TC/llvm-strip" \
        --enable-static --disable-shared --enable-pic \
        --disable-programs --disable-doc --disable-avdevice --disable-network \
        && make -j"$(nproc)" && make install)
      fi
    - export PKG_CONFIG_LIBDIR="$FFMPEG_PREFIX/lib/pkgconfig"
  # The ffmpeg it builds does not change between pipelines; the key names
  # everything it depends on, so a change to any of them builds it afresh.
  cache:
    key: ffmpeg-7.1-android-arm64-v8a-api30-ndk29
    paths:
      - ffmpeg-android/
